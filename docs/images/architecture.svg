<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="998" height="618" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="45" class="title">NNP Mail Service - System Architecture</text>
  <text x="40" y="68" class="subtitle">High-throughput asynchronous email dispatching microservice architecture</text>

  <!-- Section 1: Client Applications -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="180" height="480" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="55" y="115" width="150" height="28" rx="6" fill="#f1f5f9"/>
    <text x="130" y="134" text-anchor="middle" class="box-title">Client Tier</text>
    
    <!-- Microservices Client -->
    <rect x="55" y="160" width="150" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="75" cy="180" r="10" fill="#3b82f6"/>
    <text x="75" y="184" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">API</text>
    <text x="95" y="184" class="box-title">Microservices</text>
    <text x="65" y="208" class="box-desc">Backend Services</text>
    <text x="65" y="225" class="box-desc">Automated Workflows</text>

    <!-- Web Applications -->
    <rect x="55" y="260" width="150" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="75" cy="280" r="10" fill="#8b5cf6"/>
    <text x="75" y="284" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">WEB</text>
    <text x="95" y="284" class="box-title">Web Portals</text>
    <text x="65" y="308" class="box-desc">User Onboarding</text>
    <text x="65" y="325" class="box-desc">Billing Triggers</text>

    <!-- CLI & Integrations -->
    <rect x="55" y="360" width="150" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="75" cy="380" r="10" fill="#06b6d4"/>
    <text x="75" y="384" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">CLI</text>
    <text x="95" y="384" class="box-title">DevOps & CI/CD</text>
    <text x="65" y="408" class="box-desc">Replication Alerts</text>
    <text x="65" y="425" class="box-desc">Deployment Events</text>
  </g>

  <!-- Section 2: Core Microservice (Spring Boot 3) -->
  <g filter="url(#shadow)">
    <rect x="260" y="100" width="440" height="480" rx="12" fill="#ffffff" stroke="#6db33f" stroke-width="2"/>
    <rect x="275" y="115" width="220" height="28" rx="6" fill="#eef7ec"/>
    <text x="285" y="134" class="box-title" fill="#2d6a1e">NNP Mail Microservice</text>
    <rect x="600" y="115" width="85" height="26" rx="6" fill="#6db33f"/>
    <text x="642" y="132" text-anchor="middle" class="badge-text">Spring Boot 3</text>

    <!-- REST Controller -->
    <rect x="280" y="160" width="395" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="300" y="185" class="box-title" fill="#166534">MailServiceController (REST API)</text>
    <text x="300" y="205" class="box-desc">/api/v1/sendmail | /sendmailWithAttachment | /sendmailWithCc</text>
    <text x="300" y="223" class="box-desc">Input Validation &amp; Instant HTTP 202 Accepted Response</text>

    <!-- Service & Business Logic -->
    <rect x="280" y="255" width="395" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="300" y="280" class="box-title">EmailService &amp; Persistence Engine</text>
    <text x="300" y="300" class="box-desc">Status set to QUEUED &bull; Multipart Attachment Processing</text>
    <text x="300" y="318" class="box-desc">Dispatches email_id to ActiveMQ Artemis via JmsTemplate</text>

    <!-- Worker & Template Engine -->
    <rect x="280" y="350" width="395" height="110" rx="8" fill="#fefce8" stroke="#fef08a"/>
    <text x="300" y="375" class="box-title" fill="#854d0e">Asynchronous Consumer &amp; Rendering Engine</text>
    <text x="300" y="395" class="box-desc">MailJmsReceiver (Concurrent Consumer Pool: 3-10)</text>
    <text x="300" y="415" class="box-desc">Apache FreeMarker Template Engine (welcome, invoice, replication)</text>
    <text x="300" y="435" class="box-desc">JavaMailSender MimeMessage Dispatcher</text>

    <!-- Audit & Resend Mechanism -->
    <rect x="280" y="475" width="395" height="85" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="300" y="500" class="box-title" fill="#1e40af">Audit Tracking &amp; Resend Controller</text>
    <text x="300" y="520" class="box-desc">Delivery Status Update: Success / Error</text>
    <text x="300" y="538" class="box-desc">/api/v1/maildetails/{id} &amp; /api/v1/resendmail/{id}</text>
  </g>

  <!-- Section 3: Backing Services & Relays -->
  
  <!-- ActiveMQ Artemis Broker -->
  <g filter="url(#shadow)">
    <rect x="740" y="100" width="220" height="140" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="755" y="115" width="190" height="26" rx="6" fill="#fef2f2"/>
    <text x="850" y="133" text-anchor="middle" class="box-title" fill="#b91c1c">ActiveMQ Artemis</text>
    <text x="760" y="165" class="box-desc" font-weight="bold">JMS Message Broker</text>
    <text x="760" y="185" class="box-desc">Queue: nnp::nnp-sendmail</text>
    <text x="760" y="205" class="box-desc">Decoupled Asynchronous Queue</text>
    <text x="760" y="223" class="box-desc">Port: 61616 / 8161</text>
  </g>

  <!-- PostgreSQL Database -->
  <g filter="url(#shadow)">
    <rect x="740" y="260" width="220" height="150" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="755" y="275" width="190" height="26" rx="6" fill="#eff6ff"/>
    <text x="850" y="293" text-anchor="middle" class="box-title" fill="#1d4ed8">PostgreSQL 15+</text>
    <text x="760" y="325" class="box-desc" font-weight="bold">Persistent Store &amp; Audit Log</text>
    <text x="760" y="345" class="box-desc">Table: nnp_email (JSONB)</text>
    <text x="760" y="365" class="box-desc">Table: nnp_email_attachments</text>
    <text x="760" y="385" class="box-desc">Status: QUEUED &rarr; Success</text>
  </g>

  <!-- SMTP Relays -->
  <g filter="url(#shadow)">
    <rect x="740" y="430" width="220" height="150" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="755" y="445" width="190" height="26" rx="6" fill="#f5f3ff"/>
    <text x="850" y="463" text-anchor="middle" class="box-title" fill="#6d28d9">SMTP Gateways</text>
    <text x="760" y="495" class="box-desc" font-weight="bold">Email Delivery Relays</text>
    <text x="760" y="515" class="box-desc">&bull; AWS SES / SendGrid</text>
    <text x="760" y="535" class="box-desc">&bull; Enterprise SMTP / Exchange</text>
    <text x="760" y="555" class="box-desc">&bull; MailHog / Inbucket (Dev)</text>
  </g>

  <!-- Connector Lines & Arrows -->
  
  <!-- Client to REST API -->
  <path d="M 220 195 L 280 195" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="250" y="185" text-anchor="middle" class="arrow-text" fill="#2563eb">HTTP</text>

  <!-- Service to ActiveMQ -->
  <path d="M 675 295 L 740 170" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="225" class="arrow-text" fill="#b91c1c">Enqueue ID</text>

  <!-- ActiveMQ to JMS Receiver -->
  <path d="M 740 200 L 675 390" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="715" y="340" class="arrow-text" fill="#b91c1c">Consume</text>

  <!-- Service to PostgreSQL -->
  <path d="M 675 315 L 740 330" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="715" y="315" class="arrow-text" fill="#1d4ed8">Persist</text>

  <!-- Receiver to SMTP -->
  <path d="M 675 415 L 740 480" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="715" y="445" class="arrow-text" fill="#16a34a">SMTP Send</text>

</svg>
