# ===================================================================
# NNP Mail Service - Configuration Reference / Example
# ===================================================================
# Copy this file to application-standalone.properties or set the corresponding
# environment variables when running in Docker/Kubernetes/local environments.

# -------------------------------------------------------------------
# Application Core Settings
# -------------------------------------------------------------------
spring.application.name=nnp-mailservice
server.port=8080
spring.profiles.active=standalone

# Set to false to run without Spring Cloud Config Server
spring.cloud.config.enabled=false
# If using Spring Cloud Config Server, configure the import URL:
# spring.config.import=optional:configserver:http://localhost:8888/

# -------------------------------------------------------------------
# PostgreSQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/nnp_mailservice
spring.datasource.username=postgres
spring.datasource.password=postgres

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Apache ActiveMQ Artemis (JMS Broker) Configuration
# -------------------------------------------------------------------
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=artemis
spring.activemq.password=artemis

# -------------------------------------------------------------------
# SMTP / JavaMail Configuration
# -------------------------------------------------------------------
# For local development with MailHog / Mailpit:
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# For production SMTP (e.g. Gmail / SendGrid / AWS SES):
# spring.mail.host=smtp.sendgrid.net
# spring.mail.port=587
# spring.mail.username=apikey
# spring.mail.password=YOUR_SENDGRID_API_KEY
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true

# -------------------------------------------------------------------
# FreeMarker Template Engine Configuration
# -------------------------------------------------------------------
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftlh
spring.freemarker.charset=UTF-8
spring.freemarker.cache=false

# -------------------------------------------------------------------
# OpenAPI / Swagger UI
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.nubons.nnpmailservice=DEBUG
logging.level.org.springframework.mail=DEBUG
